    // --- Web Audio Synthesizer for beeps and chimes ---
    class AudioBeep {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      beep(freq = 600, duration = 0.08) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      stepChime() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.08);
            gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + idx * 0.08 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.08);
            osc.stop(this.ctx.currentTime + idx * 0.08 + 0.35);
          });
          if ('vibrate' in navigator) navigator.vibrate([100, 50, 100]);
        } catch (e) {}
      }
      finishSound() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);
            gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.12);
            gain.gain.linearRampToValueAtTime(0.25, this.ctx.currentTime + idx * 0.12 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.12 + 0.6);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.12);
            osc.stop(this.ctx.currentTime + idx * 0.12 + 0.65);
          });
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200, 100, 300]);
        } catch (e) {}
      }
    }

    function formatTime(secs) {
      const m = Math.floor(Math.max(0, secs) / 60);
      const s = Math.max(0, secs) % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function calculateScaledSteps(recipe, targetWater) {
      const scale = targetWater / recipe.defaultWater;
      let accum = 0;
      return recipe.steps.map((s, idx) => {
        let sw = 0;
        if (s.waterAmount > 0) {
          sw = Math.round(s.waterAmount * scale);
          accum += sw;
        }
        return {
          ...s,
          stepNumber: idx + 1,
          scaledWater: sw,
          accumulatedWater: accum
        };
      });
    }

      state.scaledSteps = calculateScaledSteps(recipe, recipe.defaultWater);
      state.view = 'detail';
      render();
      window.scrollTo(0, 0);
    }

    function openTimer() {
      state.scaledSteps = calculateScaledSteps(state.activeRecipe, state.waterAmount);
      state.currentStepIndex = 0;
      state.stepSecondsLeft = state.scaledSteps[0].duration;
      state.totalElapsedSeconds = 0;
      state.isRunning = false;
      state.isCompleted = false;
      state.view = 'timer';
      render();
      window.scrollTo(0, 0);
    }

    function backToLibrary() {
      state.view = 'library';
      render();
      window.scrollTo(0, 0);
    }

    function backToDetail() {
      if (state.timerInterval) clearInterval(state.timerInterval);
      state.isRunning = false;
      state.view = 'detail';
      render();
      window.scrollTo(0, 0);
    }

    // --- Timer Engine ---
    function toggleTimer() {
      if (state.isCompleted) {
        // Reset
        state.currentStepIndex = 0;
        state.stepSecondsLeft = state.scaledSteps[0].duration;
        state.totalElapsedSeconds = 0;
        state.isCompleted = false;
        state.isRunning = false;
        render();
        return;
      }

      state.isRunning = !state.isRunning;
      audio.init();

      if (state.isRunning) {
        state.timerInterval = setInterval(() => {
          state.totalElapsedSeconds++;

          if (state.stepSecondsLeft <= 4 && state.stepSecondsLeft > 1) {
            audio.beep(587.33, 0.08);
          } else if (state.stepSecondsLeft === 1) {
            audio.beep(880, 0.15);
          }

          if (state.stepSecondsLeft <= 1) {
            if (state.currentStepIndex < state.scaledSteps.length - 1) {
              audio.stepChime();
              state.currentStepIndex++;
              state.stepSecondsLeft = state.scaledSteps[state.currentStepIndex].duration;
            } else {
              // Completed!
              clearInterval(state.timerInterval);
              state.isRunning = false;
              state.isCompleted = true;
              state.stepSecondsLeft = 0;
              audio.finishSound();
            }
          } else {
            state.stepSecondsLeft--;
          }
          render();
        }, 1000);
      } else {
        if (state.timerInterval) clearInterval(state.timerInterval);
      }
      render();
    }

    function jumpStep(direction) {
      const newIdx = state.currentStepIndex + direction;
      if (newIdx >= 0 && newIdx < state.scaledSteps.length) {
        state.currentStepIndex = newIdx;
        state.stepSecondsLeft = state.scaledSteps[newIdx].duration;
        let elapsed = 0;
        for (let i = 0; i < newIdx; i++) {
          elapsed += state.scaledSteps[i].duration;
        }
        state.totalElapsedSeconds = elapsed;
        render();
      }
    }

            </button>

            <button
              onclick="jumpStep(1)"
              ${state.currentStepIndex === state.scaledSteps.length - 1 ? 'disabled' : ''}
              class="w-14 h-14 rounded-full bg-[#24201c] flex items-center justify-center text-[#d4a373] text-xl font-bold transition-all ${
                state.currentStepIndex === state.scaledSteps.length - 1 ? 'opacity-25 cursor-not-allowed' : 'hover:bg-[#332c25] active:scale-95'
              }"
            >
              ❯
            </button>
          </div>

          <!-- Completed Finish Overlay -->
          ${state.isCompleted ? `
            <div class="absolute inset-0 z-50 bg-[#121110]/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
              <div class="w-16 h-16 rounded-full bg-[#2d241c] border border-[#d4a373] flex items-center justify-center text-3xl mb-4 text-[#d4a373]">
                🏆
              </div>

              <h2 class="text-3xl font-serif-num font-bold text-[#f5efe6] mb-2">
                沖煮完成！
              </h2>
              <p class="text-xs text-[#a39788] mb-6">
                享受這杯精心萃取的 ${state.activeRecipe.name}
              </p>

              <div class="w-full max-w-xs bg-[#1c1a17] border border-[#2b2722] rounded-2xl p-4 mb-6 text-left space-y-2 text-xs">
                <div class="flex justify-between text-[#8f8578]">
                  <span>使用配方</span>
                  <span class="text-[#e8e2d8] font-medium">${state.activeRecipe.name}</span>
                </div>
                <div class="flex justify-between text-[#8f8578]">
                  <span>咖啡豆</span>
                  <span class="text-[#e8e2d8] font-medium">${state.beanName}</span>
                </div>
                <div class="flex justify-between text-[#8f8578]">
                  <span>粉水參數</span>
                  <span class="text-[#d4a373] font-medium font-mono">${state.coffeeAmount}g / ${state.waterAmount}g</span>
                </div>
                <div class="flex justify-between text-[#8f8578]">
                  <span>總沖煮時間</span>
                  <span class="text-[#e8e2d8] font-medium font-mono">${formatTime(state.totalElapsedSeconds)}</span>
                </div>
              </div>

              <div class="flex flex-col gap-3 w-full max-w-xs">
                <button
                  onclick="toggleTimer()"
                  class="w-full py-3.5 bg-[#2b2621] hover:bg-[#38312b] text-[#d4a373] font-medium text-xs rounded-xl border border-[#3d362e]"
                >
                  再次沖煮
                </button>
                <button
                  onclick="backToLibrary()"
                  class="w-full py-3.5 bg-[#d4a373] hover:bg-[#e0b284] text-[#1a130b] font-bold text-xs rounded-xl shadow-lg"
                >
                  完成並返回模板庫
                </button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (state.view === 'library') {
        app.innerHTML = renderLibrary();
      } else if (state.view === 'detail') {
        app.innerHTML = renderDetail();
      } else if (state.view === 'timer') {
        app.innerHTML = renderTimer();
      }
    }

    // Initial render
    state.scaledSteps = calculateScaledSteps(state.activeRecipe, state.waterAmount);
    render();
  </script>
</body>
</html>
