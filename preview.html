Flavor:`偏粗。每段注水前粉床應該已經濾乾。太細：苦澀，下一段要注水時還有積水；太粗：偏酸、單薄，水很快就流光。`,beanPairing:`淺焙、明亮的豆子：第一段比第二段少會更甜，比第二段多會更明亮。中焙約 88°C、深焙約 83°C，比較不會苦。後 60% 分較少次注水會比較淡，分較多次會比較濃。`,steps:[{id:1,type:`pour`,title:`第 1 段 — 調酸甜`,waterAmount:60,duration:10,description:`注水 60g 調整酸甜風味`},{id:2,type:`wait`,title:`等待濾乾`,waterAmount:0,duration:35,description:`等待水完全流下，粉床乾淨`},{id:3,type:`pour`,title:`第 2 段 — 完成前 40%`,waterAmount:60,duration:10,description:`注水 60g 達累計 120g`},{id:4,type:`wait`,title:`等待濾乾`,waterAmount:0,duration:35,description:`等待水滴乾`},{id:5,type:`pour`,title:`第 3 段 — 調濃淡`,waterAmount:60,duration:10,description:`進入後 60% 第一段，注入 60g`},{id:6,type:`wait`,title:`等待濾乾`,waterAmount:0,duration:35,description:`等待水滴乾`},{id:7,type:`pour`,title:`第 4 段`,waterAmount:60,duration:10,description:`注水 60g 達累計 240g`},{id:8,type:`wait`,title:`等待`,waterAmount:0,duration:20,description:`等待水位下降`},{id:9,type:`pour`,title:`第 5 段`,waterAmount:60,duration:10,description:`最後一段注水 60g 達累計 300g`},{id:10,type:`wait`,title:`等待濾完 — 3:30 移開濾杯`,waterAmount:0,duration:35,description:`濾乾後準時移開濾杯`}]},{id:`ultimate-v60`,name:`終極 V60 手法`,category:`V60`,referenceAuthor:`參考 James Hoffmann 公開沖煮方法`,defaultCoffee:30,defaultWater:500,temperature:97,totalTimeSeconds:210,ratio:`1:16.7`,summary:`悶蒸後分兩段長注水，再用湯匙順時針、逆時針各攪一下，輕搖濾杯，使粉床平整、萃取均勻。淺焙建議使用接近沸騰的水溫，接近沸騰即可，97°C 為參考值；中細研磨，目標 3:30 前濾完。`,grindAndFlavor:`中細。目標約 3:30 濾完、粉床平整。Hoffmann 只靠研磨度調整萃取：喝起來空洞、偏酸就調細，出現苦澀、粗糙感時再稍微調粗。Pourline 建議：超過 4:00 濾完就調粗，不到 3:00 就調細。`,beanPairing:`為淺焙設計：Hoffmann 建議水溫盡量高，越淺焙的豆子越是水溫越高越好。若是偏深焙的豆子，他說水滾後可以等 15、20、25 秒再開始注水。Pourline 建議：中深焙也可以把水溫降到 90°C 左右，避免苦味。`,steps:[{id:1,type:`pour`,title:`悶蒸 — 均勻浸濕咖啡粉`,waterAmount:60,duration:10,description:`快速注入粉重兩倍的水量`},{id:2,type:`wait`,title:`搖晃濾杯後悶蒸`,waterAmount:0,duration:35,description:`輕微搖晃旋轉濾杯使粉層充分潤濕`},{id:3,type:`pour`,title:`主注水至 300g`,waterAmount:240,duration:30,description:`大水流中心繞圈注水至總重 60%`},{id:4,type:`pour`,title:`放慢注水至 500g`,waterAmount:200,duration:30,description:`溫柔且持續注滿至目標總水量 500g`},{id:5,type:`stir`,title:`順時針、逆時針各攪一下，再輕搖濾杯`,waterAmount:0,duration:15,description:`用匙順逆各攪一下沖下杯壁細粉，輕晃濾杯`},{id:6,type:`wait`,title:`等待濾完 — 粉床平整`,waterAmount:0,duration:90,description:`等待自然流乾，粉床呈平坦狀態`}]},{id:`single-cup-v60`,name:`單杯 V60 手法`,category:`V60`,referenceAuthor:`參考 James Hoffmann 公開沖煮方法`,defaultCoffee:15,defaultWater:250,temperature:95,totalTimeSeconds:180,ratio:`1:16.7`,summary:`Hoffmann 的單杯配方：五段各 50g 注水，全程不攪拌，最後輕搖一次即可。穩定且容錯高，適合每天沖。淺焙建議用剛離沸的水。`,grindAndFlavor:`中細；粉量少時通常要磨細一點。目標約 3:00 濾完。太細：苦、滴得慢；太粗：偏酸、偏淡。`,beanPairing:`日常萬用，淺焙到中焙都很穩定。淺焙用剛離火的熱水，中深焙降到 90°C 左右。`,steps:[{id:1,type:`pour`,title:`悶蒸`,waterAmount:50,duration:10,description:`第一段 50g 潤濕粉床`},{id:2,type:`wait`,title:`搖晃濾杯後悶蒸`,waterAmount:0,duration:35,description:`輕晃濾杯，等待悶蒸`},{id:3,type:`pour`,title:`第 2 段 — 至 100g`,waterAmount:50,duration:10,description:`穩定注入 50g`},{id:4,type:`wait`,title:`等待`,waterAmount:0,duration:15,description:`等待水流下降`},{id:5,type:`pour`,title:`第 3 段 — 至 150g`,waterAmount:50,duration:10,description:`穩定注入 50g`},{id:6,type:`wait`,title:`等待`,waterAmount:0,duration:10,description:`等待水流下降`},{id:7,type:`pour`,title:`第 4 段 — 至 200g`,waterAmount:50,duration:10,description:`穩定注入 50g`},{id:8,type:`wait`,title:`等待`,waterAmount:0,duration:10,description:`等待水流下降`},{id:9,type:`pour`,title:`第 5 段 — 至 250g`,waterAmount:50,duration:10,description:`最後一段 50g 注滿`},{id:10,type:`wait`,title:`輕搖後等待濾完`,waterAmount:0,duration:60,description:`輕晃濾杯一次，等待完整滴乾`}]},{id:`five-pour-method`,name:`五段注水法`,category:`V60`,referenceAuthor:`參考 Matt Winton 公開沖煮方法`,defaultCoffee:20,defaultWater:300,temperature:93,totalTimeSeconds:210,ratio:`1:15`,summary:`五段各 60g 的注水。悶蒸後，每段在粉床將乾時接著注水，時間軸僅供參考。`,grindAndFlavor:`偏粗 (Hario 手搖約 12 格)。每段在粉床快乾時接著注水，總時間約 3:30。粉床幾乎一注就乾，就調細；遲遲不下降，就調粗。`,beanPairing:`五段平均注水，風味均衡，能完整呈現豆子本身的特色，適合淺到中焙。`,steps:[{id:1,type:`pour`,title:`第 1 段 — 悶蒸`,waterAmount:60,duration:10,description:`均勻注入 60g 悶蒸`},{id:2,type:`wait`,title:`等待悶蒸`,waterAmount:0,duration:35,description:`粉床排氣膨脹`},{id:3,type:`pour`,title:`第 2 段 — 至 120g`,waterAmount:60,duration:10,description:`注入 60g`},{id:4,type:`wait`,title:`等待粉床快乾`,waterAmount:0,duration:30,description:`觀察粉床表面即將微乾`},{id:5,type:`pour`,title:`第 3 段 — 至 180g`,waterAmount:60,duration:10,description:`注入 60g`},{id:6,type:`wait`,title:`等待粉床快乾`,waterAmount:0,duration:30,description:`水位接近粉床時接續`},{id:7,type:`pour`,title:`第 4 段 — 至 240g`,waterAmount:60,duration:10,description:`注入 60g`},{id:8,type:`wait`,title:`等待粉床快乾`,waterAmount:0,duration:30,description:`水位再度下降`},{id:9,type:`pour`,title:`第 5 段 — 至 300g`,waterAmount:60,duration:10,description:`最後注入 60g`},{id:10,type:`wait`,title:`等待濾完`,waterAmount:0,duration:45,description:`目標 3:30 滴濾完成`}]},{id:`origami-30s-five-pour`,name:`Origami 30 秒五段注水`,category:`Origami`,referenceAuthor:`參考 Carlos Medina 於 Slow Pour Supply 公開沖煮方法`,defaultCoffee:15.5,defaultWater:250,temperature:91,totalTimeSeconds:160,ratio:`1:16.1`,summary:`五段各 50g，每 30 秒注一次，每段由內往外再繞回中心畫圈。1:16 的小杯配方，水溫 91°C，約 2:40 完成。原配方使用軟水（約 65 ppm）與錐形濾紙。`,grindAndFlavor:`中等（原配方使用 1Zpresso ZP6 刻度 5.2）。每段大致濾下後再注下一段，總時間約 2:40。明顯超過 3:00 就調粗，不到 2:30 就調細。`,beanPairing:`適合明亮、果香調的豆子——比賽用豆是日曬 Sidra。適合淺焙與日曬處理。`,steps:[{id:1,type:`pour`,title:`第 1 段注水 — 悶蒸`,waterAmount:50,duration:10,description:`由內向外再回中心畫圈注入 50g`},{id:2,type:`wait`,title:`等待至 0:30`,waterAmount:0,duration:20,description:`靜置至 30 秒`},{id:3,type:`pour`,title:`第 2 段注水 — 至 100g`,waterAmount:50,duration:10,description:`注入 50g`},{id:4,type:`wait`,title:`等待至 1:00`,waterAmount:0,duration:20,description:`靜置至 1 分鐘`},{id:5,type:`pour`,title:`第 3 段注水 — 至 150g`,waterAmount:50,duration:10,description:`注入 50g`},{id:6,type:`wait`,title:`等待至 1:30`,waterAmount:0,duration:20,description:`靜置至 1 分 30 秒`},{id:7,type:`pour`,title:`第 4 段注水 — 至 200g`,waterAmount:50,duration:10,description:`注入 50g`},{id:8,type:`wait`,title:`等待至 2:00`,waterAmount:0,duration:20,description:`靜置至 2 分鐘`},{id:9,type:`pour`,title:`第 5 段注水 — 至 250g`,waterAmount:50,duration:10,description:`注入最後 50g`},{id:10,type:`wait`,title:`等待濾完`,waterAmount:0,duration:30,description:`約 2:40 滴完享用`}]},{id:`spin-v60`,name:`旋轉式 V60`,category:`V60`,referenceAuthor:`參考 Scott Rao 於 Hario UK 公開沖煮方法`,defaultCoffee:20,defaultWater:330,temperature:97,totalTimeSeconds:255,ratio:`1:16.5`,summary:`每段注水後旋轉濾杯讓粉床平整：悶蒸後用力旋轉，之後輕旋即可。最後一段在約七成濾完時注水，時間軸為估計值，總時間約 4 到 4 分半。`,grindAndFlavor:`中細。旋轉讓粉床保持平整，總時間 4:00–4:30 都正常。超過 5:00 就調粗，不到 3:30 就調細。`,beanPairing:`萃取均勻，適合高密度的淺焙豆，能拉出甜感與酸質；深焙豆可以把總時間縮短一點。`,steps:[{id:1,type:`pour`,title:`悶蒸注水 60g 並用力旋轉`,waterAmount:60,duration:15,description:`注水 60g 後用力搖旋濾杯`},{id:2,type:`wait`,title:`等待悶蒸`,waterAmount:0,duration:30,description:`等待至 45 秒`},{id:3,type:`pour`,title:`第 2 段注水 — 至 200g`,waterAmount:140,duration:30,description:`中心向外持續注水`},{id:4,type:`wait`,title:`輕旋濾杯並等待水位下降`,waterAmount:0,duration:45,description:`輕旋一下平整粉床，等水位降至七成`},{id:5,type:`pour`,title:`第 3 段注水 — 至 330g`,waterAmount:130,duration:30,description:`溫柔注滿至 330g`},{id:6,type:`wait`,title:`輕旋濾杯後等待完全濾乾`,waterAmount:0,duration:105,description:`輕晃平整粉床，等待滴漏完畢`}]},{id:`kalita-wave-classic`,name:`Kalita 波浪經典法`,category:`Kalita Wave`,referenceAuthor:`參考 Counter Culture Coffee 沖煮指南`,defaultCoffee:30,defaultWater:500,temperature:93,totalTimeSeconds:225,ratio:`1:16.7`,summary:`平底濾杯的沖法：悶蒸後以小水量分次補水，保持水位穩定。波浪濾杯的平底設計容錯度高，適合較大杯量。`,grindAndFlavor:`中等。平底濾杯比較寬容，3:30–4:00 濾完都可以。太細：苦、尾韻乾；太粗：偏酸、水感。`,beanPairing:`口感圓潤厚實，適合中焙和巧克力、堅果調的豆子，也適合一次沖大杯。`,steps:[{id:1,type:`pour`,title:`悶蒸 — 小水量潤濕`,waterAmount:60,duration:15,description:`溫和浸濕平底粉層`},{id:2,type:`wait`,title:`等待悶蒸`,waterAmount:0,duration:30,description:`靜候充分排氣`},{id:3,type:`pour`,title:`第 2 段注水 — 至 200g`,waterAmount:140,duration:25,description:`穩定中心畫圈注水`},{id:4,type:`wait`,title:`等待水位微降`,waterAmount:0,duration:20,description:`維持濾杯水位平穩`},{id:5,type:`pour`,title:`第 3 段注水 — 至 350g`,waterAmount:150,duration:25,description:`繼續分段補水`},{id:6,type:`wait`,title:`等待水位微降`,waterAmount:0,duration:20,description:`維持水位`},{id:7,type:`pour`,title:`第 4 段注水 — 至 500g`,waterAmount:150,duration:25,description:`最後注滿至 500g`},{id:8,type:`wait`,title:`等待濾完`,waterAmount
